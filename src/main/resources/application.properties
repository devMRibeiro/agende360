spring.application.name=clipply

server.port=${PORT:9002}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION:600000}

clipply.api-key=${CLIPPLY_API_KEY}
clipply.default-password=${CLIPPLY_DEFAULT_PASSWORD}
clipply.support-email=${CLIPPLY_SUPPORT_EMAIL}
clipply.support-phone=${CLIPPLY_SUPPORT_PHONE}
clipply.support-password=${CLIPPLY_SUPPORT_PASSWORD}
clipply.base-url=${CLIPPLY_BASE_URL}

resend.from.email=${RESEND_FROM_EMAIL}
resend.api.key=${RESEND_API_KEY}

cookie.secure=${COOKIE_SECURE:false}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}