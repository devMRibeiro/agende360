name: Claude Agente - Every hour

on:
  schedule:
    - cron: '0 6-15 * * 1-5'   # Das 9h às 18h (UTC-3), segunda a sexta
  workflow_dispatch:

jobs:
  claude-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configurar Git
        run: |
          git config user.name "Claude Agent"
          git config user.email "claude-agent@noreply.github.com"

      - name: Rodar Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --dangerously-skip-permissions -p "
            Analise o projeto Java neste repositório e implemente melhorias incrementais.
            Foco em: testes unitários com JUnit, Javadoc, refatoração de métodos longos,
            tratamento de exceções e remoção de código duplicado.

            REGRAS IMPORTANTES:
            - Use somente Java tradicional (sem lambdas, streams ou funções anônimas)
            - Não quebre funcionalidades existentes
            - Ao finalizar, execute: git add -A && git commit -m 'feat: melhorias incrementais pelo agente Claude'
          "

      - name: Push das mudanças
        run: git push